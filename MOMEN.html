<style>

/* ==================================================
   RESET
================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  padding:18px 8px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  text-align:center;
  color:white;

  background:
    radial-gradient(
      circle at 10% 10%,
      #383838 0%,
      transparent 25%
    ),

    radial-gradient(
      circle at 90% 90%,
      #292929 0%,
      transparent 25%
    ),

    linear-gradient(
      135deg,
      #000000,
      #151515,
      #050505
    );

  background-size:200% 200%;

  animation:
    backgroundMove 14s ease infinite;
}


/* ==================================================
   BACKGROUND LINGKARAN
================================================== */

body::before{

  content:"";

  position:fixed;

  width:300px;
  height:300px;

  top:-120px;
  left:-100px;

  border:
    1px solid
    rgba(255,255,255,0.15);

  border-radius:50%;

  box-shadow:
    0 0 50px
    rgba(255,255,255,0.08);

  animation:
    lightMove 10s linear infinite;

  pointer-events:none;

  z-index:-1;
}


body::after{

  content:"";

  position:fixed;

  width:400px;
  height:400px;

  right:-180px;
  bottom:-180px;

  border:
    1px solid
    rgba(255,255,255,0.12);

  border-radius:50%;

  box-shadow:
    0 0 50px
    rgba(255,255,255,0.07);

  animation:
    lightMove2 13s linear infinite;

  pointer-events:none;

  z-index:-1;
}


/* ==================================================
   WELCOME
================================================== */

marquee{

  display:block;

  width:94%;

  margin:
    5px auto 15px;

  padding:9px;

  color:white;

  background:
    rgba(255,255,255,0.05);

  border:
    1px solid #555;

  border-radius:10px;

  font-size:13px;

  font-weight:bold;

  letter-spacing:3px;

  text-shadow:
    0 0 8px white;

  box-shadow:
    0 0 15px
    rgba(255,255,255,0.08);
}


/* ==================================================
   JUDUL
================================================== */

h1{

  display:inline-block;

  max-width:95%;

  margin:
    5px auto 20px;

  padding:
    17px 25px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #000,
      #292929,
      #000
    );

  border:
    2px solid white;

  border-radius:16px;

  font-size:30px;

  letter-spacing:3px;

  text-shadow:
    0 0 5px white,
    0 0 15px
    rgba(255,255,255,0.5);

  box-shadow:
    0 0 12px
    rgba(255,255,255,0.3),

    inset 0 0 20px
    rgba(255,255,255,0.05);

  animation:
    titleShow 1s ease;
}


/* ==================================================
   GARIS
================================================== */

hr{

  width:90%;

  max-width:1000px;

  height:1px;

  margin:17px auto;

  border:none;

  background:
    linear-gradient(
      to right,
      transparent,
      #666,
      white,
      #666,
      transparent
    );

  box-shadow:
    0 0 8px
    rgba(255,255,255,0.4);
}


/* ==================================================
   JUDUL FOTO
================================================== */

.photo-title{

  position:relative;

  display:inline-block;

  max-width:90%;

  margin:
    10px auto 28px;

  padding:
    13px 38px;

  color:white;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.09),
      rgba(255,255,255,0.02)
    );

  border:
    1px solid #777;

  border-left:
    4px solid white;

  border-right:
    4px solid white;

  border-radius:12px;

  font-size:23px;

  letter-spacing:4px;

  text-shadow:
    0 0 8px white,
    0 0 20px
    rgba(255,255,255,0.5);

  box-shadow:
    0 0 20px
    rgba(255,255,255,0.1);

  animation:
    photoTitle 1s ease;
}


.photo-title::before,
.photo-title::after{

  content:"✦";

  position:absolute;

  top:50%;

  transform:
    translateY(-50%);

  font-size:15px;

  animation:
    starBlink 1.5s
    infinite alternate;
}


.photo-title::before{
  left:10px;
}


.photo-title::after{
  right:10px;
}


/* ==================================================
   ALBUM
================================================== */

.album{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(240px,1fr)
    );

  gap:23px;

  width:94%;

  max-width:1100px;

  margin:
    0 auto 35px;
}


/* ==================================================
   KARTU FOTO
================================================== */

.photo-card{

  position:relative;

  width:100%;

  padding:7px;

  background:
    linear-gradient(
      145deg,
      #222,
      #050505
    );

  border:
    1px solid #555;

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,0.8);

  opacity:0;

  cursor:pointer;

  animation:
    photoAppear
    0.8s ease forwards;

  transition:
    transform 0.4s ease,
    box-shadow 0.4s ease,
    border-color 0.4s ease;
}


/* ANIMASI */

.photo-card:nth-child(1){
  animation-delay:.1s;
}

.photo-card:nth-child(2){
  animation-delay:.2s;
}

.photo-card:nth-child(3){
  animation-delay:.3s;
}

.photo-card:nth-child(4){
  animation-delay:.4s;
}

.photo-card:nth-child(5){
  animation-delay:.5s;
}

.photo-card:nth-child(6){
  animation-delay:.6s;
}

.photo-card:nth-child(7){
  animation-delay:.7s;
}

.photo-card:nth-child(8){
  animation-delay:.8s;
}

.photo-card:nth-child(9){
  animation-delay:.9s;
}


/* HOVER */

.photo-card:hover{

  transform:
    translateY(-9px)
    scale(1.025);

  border-color:white;

  box-shadow:

    0 0 10px white,

    0 0 25px
    rgba(255,255,255,0.5),

    0 15px 40px
    rgba(0,0,0,0.9);

  z-index:5;
}


/* ==================================================
   FOTO
================================================== */

.photo-card img{

  display:block;

  width:100%;

  height:230px;

  object-fit:cover;

  border-radius:12px;

  filter:
    grayscale(15%)
    brightness(.9);

  transition:
    transform .6s ease,
    filter .6s ease;
}


.photo-card:hover img{

  transform:
    scale(1.08);

  filter:
    grayscale(0%)
    brightness(1.08);
}


/* CAHAYA */

.photo-card::after{

  content:"";

  position:absolute;

  top:-100%;

  left:-150%;

  width:80%;

  height:300%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.18),
      transparent
    );

  transform:
    rotate(25deg);

  transition:
    .8s;
}


.photo-card:hover::after{
  left:150%;
}


/* ==================================================
   NOMOR FOTO
================================================== */

.photo-number{

  position:absolute;

  top:14px;
  left:14px;

  width:32px;
  height:32px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:white;

  background:
    rgba(0,0,0,.75);

  border:
    1px solid white;

  border-radius:50%;

  font-size:11px;

  font-weight:bold;

  box-shadow:
    0 0 10px
    rgba(255,255,255,.5);

  z-index:3;
}


/* ==================================================
   KATA-KATA
================================================== */

h3{

  display:inline-block;

  max-width:90%;

  padding:

  color:white;

  font-size:20px;

  letter-spacing:2px;

  text-shadow:

  animation:

}


h3 + p{

  background:

  border:

  border-radius:7px;

  font-size:12px;
}


/* ==================================================
   LIGHTBOX
================================================== */

.lightbox{

  position:fixed;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:15px;

  background:
    rgba(0,0,0,.94);

  backdrop-filter:
    blur(10px);

  opacity:0;

  visibility:hidden;

  transition:.4s;

  z-index:999;
}


.lightbox.active{

  opacity:1;

  visibility:visible;
}


.lightbox img{

  display:block;

  width:auto;

  max-width:95vw;

  max-height:85vh;

  object-fit:contain;

  border:
    2px solid white;

  border-radius:14px;

  box-shadow:

    0 0 20px white,

    0 0 60px
    rgba(255,255,255,.5);

  transform:
    scale(.7);

  transition:.4s;
}


.lightbox.active img{
  transform:scale(1);
}


/* ==================================================
   CLOSE
================================================== */

.close{

  position:absolute;

  top:15px;
  right:18px;

  width:45px;
  height:45px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:white;

  background:#111;

  border:
    1px solid white;

  border-radius:50%;

  font-size:25px;

  cursor:pointer;

  transition:.3s;

  z-index:1000;
}


.close:hover{

  background:white;

  transform:

  box-shadow:
    0 0 20px white;

::-webkit-scrollbar-thumb{

  background:#555;

  border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
  background:white;
}


/* ==================================================
   ANIMASI
================================================== */

@keyframes backgroundMove{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}


@keyframes lightMove{

  0%{
    transform:
      translate(0,0)
      rotate(0deg);
  }

  50%{
    transform:
      translate(120px,90px)
      rotate(180deg);
  }

  100%{
    transform:
      translate(0,0)
      rotate(360deg);
  }
}


@keyframes lightMove2{

  0%{
    transform:
      translate(0,0)
      rotate(0deg);
  }

  50%{
    transform:
      translate(-100px,-80px)
      rotate(180deg);
  }

  100%{
    transform:
      translate(0,0)
      rotate(360deg);
  }
}


@keyframes titleShow{

  from{
    opacity:0;

    transform:
      translateY(-30px)
      scale(.8);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }
}


@keyframes photoTitle{

  from{
    opacity:0;

    transform:
      translateY(30px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);
  }
}


@keyframes photoAppear{

  from{
    opacity:0;

    transform:
      translateY(50px)
      scale(.85);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }
}


@keyframes starBlink{

  from{
    opacity:.3;
    text-shadow:none;
  }

  to{
    opacity:1;

    text-shadow:
      0 0 10px white,
      0 0 20px white;
  }
}


@keyframes fadeUp{

  from{
    opacity:0;

    transform:
      translateY(20px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);
  }
}


@keyframes quoteShow{

  from{
    opacity:0;

    transform:
      scale(.9);
  }

  to{
    opacity:1;

    transform:
      scale(1);
  }
}

<script>

/**
 * Membuka foto dalam tampilan penuh.
 *
 * @param {HTMLElement} card
 */
function openPhoto(card) {

  const image =
    card.querySelector("img");

  const lightbox =
    document.getElementById("lightbox");

  const lightboxImg =
    document.getElementById("lightbox-img");


  /* Cegah error jika elemen tidak ditemukan */

  if (
    !image ||
    !lightbox ||
    !lightboxImg
  ) {

    return;

  }


  /* Masukkan foto ke lightbox */

  lightboxImg.src =
    image.src;


  /* Gunakan alt foto */

  lightboxImg.alt =
    image.alt ||
    "Foto diperbesar";


  /* Tampilkan lightbox */

  lightbox.classList.add(
    "active"
  );


  /* Kunci scroll halaman */

  document.body.style.overflow =
    "hidden";
}


/**
 * Menutup lightbox.
 */
function closePhoto() {

  const lightbox =
    document.getElementById("lightbox");


  if (!lightbox) {

    return;

  }


  lightbox.classList.remove(
    "active"
  );


  document.body.style.overflow =
    "";
}


/* ==================================================
   KLIK AREA HITAM
================================================== */

const lightbox =
  document.getElementById("lightbox");


if (lightbox) {

  lightbox.addEventListener(
    "click",
    function(event) {

      if (
        event.target === lightbox
      ) {

        closePhoto();

      }

    }
  );

}


/* ==================================================
   TOMBOL ESC
================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closePhoto();

    }

  }
);

</script>
